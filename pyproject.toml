[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "cm-time"
version = "1.0.2"
description = "A simple context manager that measures time using perf_counter()"
readme = "README.md"
license = "CC0-1.0"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
urls."Bug Tracker" = "https://github.com/34j/cm-time/issues"
urls.Changelog = "https://github.com/34j/cm-time/blob/main/CHANGELOG.md"
urls.documentation = "https://cm-time.readthedocs.io"
urls.repository = "https://github.com/34j/cm-time"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
